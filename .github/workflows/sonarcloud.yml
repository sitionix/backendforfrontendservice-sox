name: SonarCloud

on:
  push:
    branches:
      - develop
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven repo
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Materialize Maven settings
        uses: ./.github/actions/materialize-maven-settings
        with:
          maven_repository_username: ${{ vars.MAVEN_REPOSITORY_USERNAME }}
          maven_repository_token: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
          output_path: .maven-settings.xml

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          API_VERSION: '1.44'
        run: >
          mvn -B -ntp -s .maven-settings.xml -Dtestcontainers.version=1.20.1 -Dapi.version=1.44 verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=sitionix-vv
          -Dsonar.projectKey=sitionix_backendforfrontendservice-sox
          -Dsonar.coverage.jacoco.xmlReportPaths=${GITHUB_WORKSPACE}/**/target/site/jacoco/jacoco.xml
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.exclusions=**/target/generated-sources/**,**/generated/**,**/build/**,**/*.md,**/*.txt
