api:
  rest:
    client:
      athssox:
        base-path: ${forgeit.wiremock.base-url}/authsox
      atmssox:
        base-path: ${forgeit.wiremock.base-url}/atmssox
      stsssox:
        base-path: ${forgeit.wiremock.base-url}/stsssox
      wagssox:
        base-path: ${forgeit.wiremock.base-url}/wagssox
forge:
  user-jwt:
    auth-base-url: ${forgeit.wiremock.base-url}/authsox
  security:
    service-id: sitionixBff
    dev:
      jwt-secret: dev-internal-auth-secret
      issuer: sitionix-internal
      ttl-seconds: 300
    targets:
      sitionixAuth:
        host: localhost
      sitionixAutomation:
        host: automationservice-sox
sitionix:
  cors:
    allowed-origins:
      - "http://localhost"
  csrf-origin-guard:
    enabled: false
