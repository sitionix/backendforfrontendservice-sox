sitionix:
  cors:
    allowed-origins:
      - "http://localhost:3000"
server:
  port: 8080
  servlet:
    context-path: /bffssox
api:
  rest:
    client:
      athssox:
        base-path: http://localhost:9090/authsox
      stsssox:
        base-path: ${API_REST_CLIENT_STSSSOX_BASE_PATH:http://localhost:8081/stsssox}
      wagssox:
        base-path: ${API_REST_CLIENT_WAGSSOX_BASE_PATH:http://localhost:9082/wagssox}
forge:
  user-jwt:
    auth-base-url: http://authorisationservice-sox/authsox
  security:
    service-id: sitionixBff
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    targets:
      sitionixAuth:
        host: authorisationservice-sox
      sitionixSite:
        host: siteservice-sox
      sitionixWorkspace:
        host: workspaceaggregationservice-sox
