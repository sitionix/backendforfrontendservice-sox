api:
  rest:
    client:
      defaults:
        connect-timeout: 2s
        read-timeout: 10s
sitionix:
  csrf-origin-guard:
    enabled: true
    protected-paths:
      - "/api/v1/auth/refresh"
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: "livenessState,ping"
        readiness:
          include: "readinessState,ping"
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
security:
  refresh-cookie:
    name: "__Host-refresh_token"
    http-only: true
    same-site: "Lax"
    path: "/"
    secure: true
server:
  port: 8080
  servlet:
    context-path: /bffssox
forge:
  security:
    service-id: sitionixBff
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET}
      issuer: sitionix-internal
      ttl-seconds: 300
