sitionix:
  cors:
    allowed-origins:
      - "http://localhost:3000"
server:
  port: 8080
  servlet:
    context-path: /bffssox
api:
  rest:
    client:
      athssox:
        base-path: http://localhost:9090/authsox
forge:
  security:
    service-id: sitionixBff
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    targets:
      sitionixAuth:
        host: authorisationservice-sox
