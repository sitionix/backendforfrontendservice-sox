sitionix:
  cors:
    allowed-origins:
      - "http://localhost:3000"
security:
  session:
    cookie-name: "__Host-admin_session"
    same-site: "Lax"
    secure: true
    http-only: true
    idle-timeout-seconds: 86400
    absolute-timeout-seconds: 1209600
    rotation-interval-seconds: 86400
    refresh-skew-seconds: 60
    touch-throttle-seconds: 30
    public-paths:
      - "/api/v1/session"
      - "/api/v1/auth/login"
      - "/api/v1/auth/refresh"
      - "/api/v1/users"
      - "/api/v1/auth/email/verify"
    csrf:
      enabled: true
      cookie-name: "XSRF-TOKEN"
      header-name: "X-CSRF"
      protected-methods: [ "POST", "PUT", "PATCH", "DELETE" ]
      ignore-paths:
        - "/api/v1/auth/login"
        - "/api/v1/users"
        - "/api/v1/auth/email/verify"
    session-store:
      type: "inmemory"
server:
  port: 8080
  servlet:
    context-path: /bffssox
api:
  rest:
    client:
      athssox:
        base-path: http://localhost:9090/authsox
      stsssox:
        base-path: ${API_REST_CLIENT_STSSSOX_BASE_PATH:http://localhost:8081/stsssox}
      wagssox:
        base-path: ${API_REST_CLIENT_WAGSSOX_BASE_PATH:http://localhost:9082/wagssox}
forge:
  user-jwt:
    auth-base-url: http://authorisationservice-sox/authsox
  security:
    service-id: sitionixBff
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    targets:
      sitionixAuth:
        host: authorisationservice-sox
      sitionixSite:
        host: siteservice-sox
      sitionixWorkspace:
        host: workspaceaggregationservice-sox
